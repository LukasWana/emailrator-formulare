<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otázky pro Martina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@90,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f3f5f4; --surface: #ffffff; --ink: #1a1f21; --muted: #5a6569; --line: #d7dddc;
  --accent: #00747f; --accent-soft: #dff0f1; --accent-ink: #ffffff;
  --ok: #2d7a3c; --ok-soft: #e3f1e5;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111516; --surface: #1a2022; --ink: #e6ebeb; --muted: #97a3a6; --line: #2b3336;
    --accent: #4ec2cf; --accent-soft: #143439; --accent-ink: #0b1a1c; --ok: #6cc47c; --ok-soft: #16301b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111516; --surface: #1a2022; --ink: #e6ebeb; --muted: #97a3a6; --line: #2b3336;
  --accent: #4ec2cf; --accent-soft: #143439; --accent-ink: #0b1a1c; --ok: #6cc47c; --ok-soft: #16301b;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; }
[hidden] { display: none !important; }
.obal { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-stretch: 90%; font-weight: 700; font-size: clamp(26px, 5vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-stretch: 90%; font-weight: 700; font-size: 24px; margin: 6px 0 0; }
p.uvod { margin: 0; color: var(--muted); font-size: 18px; }
.stav { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 10px 6px; display: flex; flex-direction: column; gap: 6px;
  font-size: 17px; color: var(--muted); }
.pruh { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.pruh > div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .pruh > div { transition: none; } }
/* rozcestník kroků: jeden řádek na krok, vpravo kolik je v něm vyplněno */
.kroky { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.krok { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-size: 17px; padding: 8px 12px; min-height: 44px;
  border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.krok:hover { border-color: var(--accent); }
.krok.aktualni { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.krok.hotovo { border-color: var(--ok); }
.krok .cislo { flex: 0 0 2em; color: var(--muted); font-weight: 600; }
.krok .pocet { margin-left: auto; color: var(--muted); font-size: 15px; white-space: nowrap; }
.krok.hotovo .pocet { color: var(--ok); }
.radek { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.radek.hotovo { border-color: var(--ok); }
.radek h3 { margin: 0; font-size: 21px; font-weight: 600; }
.radek h3 small { font-weight: 400; color: var(--muted); font-size: 16px; }
.skupina { display: flex; flex-direction: column; gap: 4px; }
.skupina > span { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; cursor: pointer; }
.chip { font-size: 18px; font-weight: 500; padding: 10px 14px; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.chip.vybrana { border-color: var(--ok); background: var(--ok-soft); font-weight: 600; }
.chip.vybrana::after { content: " ✓"; color: var(--ok); }
.chip:focus-visible, .krok:focus-visible, .navig button:focus-visible, input:focus-visible, textarea:focus-visible, .odeslat:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pole { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .pole { grid-template-columns: 1fr; } }
input[type=text], textarea { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; min-height: 44px; }
textarea { min-height: 76px; }
.navig { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
.navig button { font-size: 18px; font-weight: 600; padding: 12px 18px; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.navig button.dal { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.odeslat { font-size: 20px; font-weight: 600; padding: 14px 22px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); align-self: flex-start; }
.hlaska { font-size: 16px; color: var(--muted); min-height: 1.4em; }
p.souhrn { margin: 0; }
</style>

<div class="obal">
  <h1>Otázky pro Martina</h1>
  <p class="uvod" id="uvod"></p>
  <div class="stav"><span id="stav-text"></span><div class="pruh" aria-hidden="true"><div id="pruh"></div></div></div>

<script>
// Odpovědi bez přihlášení do Claude (vkládá `bez_prihlaseni.vloz` na místo značky v šabloně stránky pro produkční).
// Do db artifactu smí zapisovat jen přihlášený Contributor. Kdo stránku jen otevřel odkazem, odpovídá místně:
// odpovědi drží prohlížeč (localStorage) a `ukaz` dá tlačítko, které otevře novou zprávu v Gmailu (produkční pracují
// v Chrome s Gmailem) s řádky „id: volba | upřesnění“ → `bez_prihlaseni.py odpovedi`. Záloha: text ke zkopírování.
const bezPrihlaseni = (klic, predmet) => {
  const KAM = "qwanap@gmail.com";  // schránka, kterou čte `gmail_sync.py hist` (adresa na stránce: pokyn uživatele 30. 9.)
  const TY = typeof HRAVE !== "undefined" && HRAVE;  // Milan: autor mu tyká
  const MAX_URL = 6000;            // delší adresu Gmail nemusí přijmout → jen kopírování
  const el = (tag, styl, text) => { const e = document.createElement(tag); e.style.cssText = styl; if (text != null) e.textContent = text; return e; };
  return {
    nacti() { try { return JSON.parse(localStorage.getItem(klic)) || {}; } catch (e) { return {}; } },
    uloz(stav) { try { localStorage.setItem(klic, JSON.stringify(stav)); } catch (e) {} },
    text(polozky, stav, pole) {
      return polozky.filter((p) => stav[p.id]).map((p) => {
        const a = stav[p.id];
        return `${p.id}: ${a[pole] || ""}${a.text ? " | " + a.text.replace(/\s+/g, " ") : ""}`;
      }).join("\n") + "\n— konec —";  // poslední řádek: co je v e-mailu pod ním, k odpovědím nepatří
    },
    ukaz(kam, text) {
      const url = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(KAM)}&su=${encodeURIComponent(predmet)}&body=${encodeURIComponent(text)}`;
      const jde = url.length <= MAX_URL;
      const a = el("a", "font-size:20px;font-weight:600;padding:14px 22px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none", "Odeslat odpovědi e-mailem");
      a.href = url; a.target = "_blank"; a.rel = "noopener"; a.id = "bp-mailem";
      const p = el("p", "margin:0;font-size:17px;color:var(--muted)",
        (jde ? "Neotevřel se e-mail? " : "") + (TY ? `Zkopíruj odpovědi a pošli je na ${KAM}.` : `Zkopírujte odpovědi a pošlete je na ${KAM}.`));
      const t = el("textarea", "font:inherit;font-size:16px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:220px;width:100%;box-sizing:border-box");
      t.readOnly = true; t.value = text; t.id = "bp-souhrn"; t.setAttribute("aria-label", TY ? "Tvoje odpovědi" : "Vaše odpovědi");
      const b = el("button", "font:inherit;font-size:18px;padding:10px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer", "Zkopírovat odpovědi");
      b.type = "button";
      const s = el("div", "font-size:17px;color:var(--muted);min-height:1.4em");
      s.setAttribute("role", "status");
      b.onclick = async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) {
          t.focus(); t.select();
          try { ok = document.execCommand("copy"); } catch (e2) {}
        }
        s.textContent = ok ? (TY ? "Zkopírováno. Vlož do e-mailu." : "Zkopírováno. Vložte do e-mailu.") : (TY ? "Text je označený — zkopíruj ho (Ctrl+C) a vlož do e-mailu." : "Text je označený — zkopírujte ho (Ctrl+C) a vložte do e-mailu.");
      };
      kam.style.cssText = "display:flex;flex-direction:column;gap:12px;align-items:center;width:100%";
      kam.replaceChildren(...(jde ? [a] : []), p, t, b, s);
    },
  };
};

const MATERIALY = [{"id": "t01", "nazev": "bílá samolepka", "pozn": "s tiskem"}, {"id": "t02", "nazev": "čirá samolepka", "pozn": "s tiskem"}, {"id": "t03", "nazev": "litá fólie", "pozn": "polepy aut"}, {"id": "t04", "nazev": "OWV", "pozn": "perforovaná do oken"}, {"id": "t05", "nazev": "translucent", "pozn": ""}, {"id": "t06", "nazev": "backlight", "pozn": ""}, {"id": "t07", "nazev": "reflexní fólie", "pozn": ""}, {"id": "t08", "nazev": "tisková fólie do −10 °C", "pozn": ""}, {"id": "t09", "nazev": "magnetka", "pozn": ""}, {"id": "t10", "nazev": "podlahová grafika", "pozn": ""}, {"id": "t11", "nazev": "tapeta", "pozn": ""}, {"id": "t12", "nazev": "banner a plachta", "pozn": ""}, {"id": "t13", "nazev": "rollup", "pozn": "potištěná část"}, {"id": "t14", "nazev": "polep okna a výlohy", "pozn": ""}];
const OTAZKY = [{"id": "t91", "otazka": "Umí UV role tisknout oboustranně (4/4)?", "moznosti": ["ano", "ne, jen UV deska", "jinak"]}, {"id": "t92", "otazka": "Bílý podtisk (čirá fólie, plexi): kdy se dává? (zaškrtněte vše, co platí)", "vice": true, "moznosti": ["vždy, když zákazník neřekne jinak", "jen na čirou fólii", "jen na plexi", "jen na přání zákazníka", "rozhoduje tiskař podle podkladů"]}, {"id": "t93", "otazka": "Co se u tisku pořád zapomíná nebo se musí doptávat?"}, {"id": "t94", "otazka": "Co by se nikdy nemělo v poptávce brát jako standard?"}, {"id": "t95", "otazka": "Oka na banneru, když zákazník rozteč neurčí:", "moznosti": ["po 30 cm", "po 50 cm", "vždy se ptáme zákazníka", "jinak"]}, {"id": "t96", "otazka": "Polep vozidla bez udání materiálu: co se bere?", "moznosti": ["litá fólie + laminace", "polymerická fólie + laminace", "vždy se ptáme zákazníka", "jinak"]}, {"id": "t97", "otazka": "Deska bez udání povrchu: lesk, nebo mat?", "moznosti": ["lesk", "mat", "vždy se ptáme zákazníka", "jinak"]}, {"id": "t98", "otazka": "Dibond 2 mm a 3 mm: který se bere, když zákazník neřekne (tloušťka hliníku, dodavatel)?"}, {"id": "t99", "otazka": "Když v zakázce stojí jen „polymer tisk bílý“ nebo „fólie tisk čirý“ bez značky: kterou fólii dáš?"}, {"id": "t100", "otazka": "Vyjmenuj všechny tiskové stroje a řezací stroje. U každého: co na něm tiskneš nebo řežeš, největší šířka a tloušťka, co na něm nejde."}, {"id": "t101", "otazka": "Která práce se dělá ručně a jak (např. oboustranný tisk na roli, lepení, skládání z více kusů)?"}, {"id": "t102", "otazka": "Co u vás pořád chybí nebo se zdržuje u dodavatelů materiálu (jaký materiál, kdo dodává, jak dlouho)?"}, {"id": "t103", "otazka": "Rollup a další kompletace (stojany, rámy, textil): co je v základní dodávce a co se dokupuje zvlášť?"}, {"id": "t104", "otazka": "Tapeta a podlahová grafika: na čem se tiskne, jaká je ochranná vrstva a co se musí zeptat zákazníka?"}, {"id": "t105", "otazka": "Kdo a jak kontroluje hotový tisk před odesláním (barva, ořez, počty)? Co se vrací nejčastěji?"}, {"id": "t106", "otazka": "Typické lhůty od dodání dat po hotovo (samolepka, banner, deska, polep vozidla, polep skla). Napiš ke každému rozmezí a co ho prodlužuje."}, {"id": "t107", "otazka": "Co děláš na zakázku, ale nepovažuješ za běžné (a co naopak neumíme vyrobit)?"}, {"id": "t108", "otazka": "Co dalšího se v tisku a finiši děje a nebylo v dotazníku? Napiš i to, co se děje zřídka."}, {"id": "t109", "otazka": "Magnetka s potiskem: jakou tloušťku bereš, když zákazník nic neřekne?", "moznosti": ["bílá 0,4 mm", "bílá 0,6 mm", "bílá 0,85 mm", "hnědá 0,6 mm", "jinak"]}, {"id": "t110", "otazka": "Magnetka se potiskuje jako role, nebo jako deska?", "moznosti": ["UV role", "UV deska", "jinak"]}, {"id": "t111", "otazka": "Na kterém stroji se obvykle tisknou desky (PVC, dibond, kapa)?", "moznosti": ["UV deska", "UV Colorado", "UV role", "záleží na materiálu nebo tloušťce", "jinak"]}, {"id": "t112", "otazka": "Samolepky: když zákazník neřekne, jak vyříznout, co je standard?", "moznosti": ["kontura (výsek po tvaru)", "rovný ořez", "vždy se ptáme zákazníka"]}, {"id": "t113", "otazka": "Kde se laminuje vždy, i když to zákazník neřekne? (zaškrtněte vše, co platí)", "vice": true, "moznosti": ["venkovní polep", "podlaha", "auto", "výloha", "interiér", "nikde, jen na přání"]}, {"id": "t114", "otazka": "Polep oken a výloh: jak se tiskne a lepí?", "moznosti": ["zrcadlově, lepí se zevnitř na sklo", "normálně, lepí se zvenku", "s bílým podtiskem", "jinak"]}, {"id": "t115", "otazka": "Pantone nebo RAL: kdy ho musí zákazník dodat a kdy stačí CMYK?", "moznosti": ["vždy u loga a firemních barev", "jen když zákazník trvá na přesné barvě", "stačí CMYK, Pantone nevyžadujeme", "jinak"]}, {"id": "t116", "otazka": "U pískované fólie stojí „IP 02“, „IP 03“, „IP 05“. Je to poslední dvojčíslí kódu IP 78xx (IP 02 = IP 7802)?", "moznosti": ["ano", "ne"]}, {"id": "t117", "otazka": "U samolepky stojí „split“. Co to je?", "moznosti": ["příplatková operace (dělení podkladu)", "varianta materiálu, kterou volí zákazník", "jen pokyn pro výrobu, nic se neúčtuje", "jinak"]}, {"id": "t118", "otazka": "Tloušťka desky, když zákazník nic neřekne: PVC (forex) a plexi. (zaškrtněte vše, co platí)", "vice": true, "moznosti": ["PVC 3 mm", "PVC 5 mm", "plexi 3 mm", "plexi 5 mm", "vždy se ptáme zákazníka"]}, {"id": "t119", "otazka": "Desky: čím se standardně řežou? (zaškrtněte vše, co platí)", "vice": true, "moznosti": ["fréza", "laser", "plotr", "pila", "ručně"]}, {"id": "t120", "otazka": "Desky: rohy.", "moznosti": ["bez zaoblení", "zaoblené, když zákazník neřekne ostré", "podle zakázky"]}];
const KROKY = [{"nazev": "Samolepky a fólie", "popis": "U každého materiálu: na čem se tiskne, jaká laminace, jaká fólie a nejvyšší šířka.", "polozky": ["t01", "t02", "t03", "t04", "t05", "t06", "t07", "t08"]}, {"nazev": "Další materiály", "popis": "Magnetka, podlaha, tapeta, banner, rollup, okno. Stejně jako v předchozí části.", "polozky": ["t09", "t10", "t11", "t12", "t13", "t14"]}, {"nazev": "Stroje a ruční práce", "popis": "Co máte za stroje, co na kterém jde a co se dělá ručně.", "polozky": ["t100", "t101", "t91", "t110", "t111", "t119"]}, {"nazev": "Desky, banner, magnetka – bez zadání", "popis": "Co se bere, když zákazník v poptávce nic neřekne.", "polozky": ["t97", "t98", "t118", "t120", "t95", "t109"]}, {"nazev": "Fólie a barvy – bez zadání", "popis": "Co se bere, když zákazník v poptávce nic neřekne.", "polozky": ["t99", "t96", "t112", "t113", "t114", "t92", "t115"]}, {"nazev": "Pojmy, dodavatelé, kompletace", "popis": "", "polozky": ["t116", "t117", "t102", "t103", "t104"]}, {"nazev": "Provoz, lhůty a co chybí", "popis": "", "polozky": ["t105", "t106", "t107", "t93", "t94", "t108"]}, {"nazev": "Odeslat odpovědi", "popis": "Odpovědi odejdou e-mailem najednou, i kdyby něco zůstalo prázdné."}];
const STROJE = ["UV role", "UV Colorado", "UV deska", "Solvent", "jinde / ručně"];
const LAM = ["žádná", "monomerická", "polymerická", "litá", "záleží"];
const KLIC_KROK = "otazky-martin-krok";
const bp = bezPrihlaseni("otazky-martin", "Otázky – Martin – odpovědi");
let odp = bp.nacti();
let krok = Math.min(Math.max(parseInt(localStorage.getItem(KLIC_KROK), 10) || 0, 0), KROKY.length - 1);
const POLOZKY = Object.fromEntries([...MATERIALY, ...OTAZKY].map((p) => [p.id, p]));
const CELKEM = MATERIALY.length + OTAZKY.length;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function vyplneno(a) { return !!a && Object.values(a).some((v) => v && String(v).trim()); }
function uloz(id, pole, hodnota) {
  const a = odp[id] || (odp[id] = {});
  if (a[pole] === hodnota) delete a[pole]; else a[pole] = hodnota;   // druhé kliknutí na tutéž volbu ji zruší
  if (!vyplneno(a)) delete odp[id];
  bp.uloz(odp);
  obnov();
}
function ulozText(id, pole, hodnota) {
  const a = odp[id] || (odp[id] = {});
  a[pole] = hodnota;
  if (!vyplneno(a)) delete odp[id];
  bp.uloz(odp);
  stav();
}
function chips(id, pole, moznosti) {
  const k = el("div", "chips");
  for (const m of moznosti) {
    const b = el("button", "chip" + ((odp[id] || {})[pole] === m ? " vybrana" : ""), m);
    b.type = "button"; b.onclick = () => uloz(id, pole, m); k.append(b);
  }
  return k;
}
// víc zaškrtnutých možností najednou: uloženo jako „a; b; c“ (stejný tvar jako na stránkách rolí)
function chipsVice(id, pole, moznosti) {
  const k = el("div", "chips");
  const vybrane = ((odp[id] || {})[pole] || "").split("; ").filter(Boolean);
  for (const m of moznosti) {
    const b = el("button", "chip" + (vybrane.includes(m) ? " vybrana" : ""), m);
    b.type = "button";
    b.onclick = () => {
      const a = odp[id] || (odp[id] = {});
      const v = vybrane.includes(m) ? vybrane.filter((x) => x !== m) : [...vybrane, m];
      if (v.length) a[pole] = v.join("; "); else delete a[pole];
      if (!vyplneno(a)) delete odp[id];
      bp.uloz(odp); obnov();
    };
    k.append(b);
  }
  return k;
}
function skupina(nazev, obsah) { const s = el("div", "skupina"); s.append(el("span", null, nazev), obsah); return s; }
function vstup(id, pole, popisek, ukazka) {
  const i = el("input"); i.type = "text"; i.placeholder = ukazka; i.setAttribute("aria-label", popisek);
  i.value = (odp[id] || {})[pole] || ""; i.oninput = () => ulozText(id, pole, i.value);
  return skupina(popisek, i);
}
function pocetVKroku(k) { return (k.polozky || []).filter((id) => vyplneno(odp[id])).length; }
function stav() {
  const n = [...MATERIALY, ...OTAZKY].filter((p) => vyplneno(odp[p.id])).length;
  $("stav-text").textContent = `Vyplněno ${n} z ${CELKEM} (materiály a otázky dohromady)`;
  $("pruh").style.width = Math.round(100 * n / CELKEM) + "%";
  for (const id of Object.keys(POLOZKY)) { const r = $("r-" + id); if (r) r.classList.toggle("hotovo", vyplneno(odp[id])); }
  KROKY.forEach((k, i) => {
    const b = $("krok-" + i); if (!b || !k.polozky) return;
    const v = pocetVKroku(k);
    b.classList.toggle("hotovo", v === k.polozky.length);
    b.querySelector(".pocet").textContent = `${v} / ${k.polozky.length}`;
  });
  const s = $("souhrn"); if (s) s.textContent = `Vyplněno ${n} z ${CELKEM}. Co je prázdné, zůstane prázdné – to je v pořádku.`;
  const o = $("odeslat"); if (o) bp.ukaz(o, text());
}
function text() {
  const radky = [];
  for (const m of MATERIALY) {
    const a = odp[m.id]; if (!vyplneno(a)) continue;
    const c = [a.lam && "lam: " + a.lam, a.znacka && "fólie: " + a.znacka.replace(/\s+/g, " "), a.sirka && "šířka: " + a.sirka.replace(/\s+/g, " ")].filter(Boolean);
    radky.push(`${m.id}: ${a.stroj || "-"}${c.length ? " | " + c.join("; ") : ""}`);
  }
  for (const q of OTAZKY) {
    const a = odp[q.id]; if (!vyplneno(a)) continue;
    radky.push(`${q.id}: ${a.volba || ""}${a.text ? " | " + a.text.replace(/\s+/g, " ") : ""}`);
  }
  return radky.join("\n") + "\n— konec —";
}
function radekMaterialu(m) {
  const r = el("section", "radek"); r.id = "r-" + m.id;
  const h = el("h3", null, m.nazev); if (m.pozn) h.append(" ", el("small", null, m.pozn));
  const p = el("div", "pole");
  p.append(vstup(m.id, "znacka", "Fólie / značka", "např. 3M IJ180"), vstup(m.id, "sirka", "Max. šířka", "např. 1600 mm"));
  r.append(h, skupina("Stroj", chips(m.id, "stroj", STROJE)), skupina("Laminace", chips(m.id, "lam", LAM)), p);
  return r;
}
function radekOtazky(q) {
  const r = el("section", "radek"); r.id = "r-" + q.id; r.append(el("h3", null, q.otazka));
  if (q.moznosti) r.append((q.vice ? chipsVice : chips)(q.id, "volba", q.moznosti));
  const a = el("textarea"); a.setAttribute("aria-label", q.otazka);
  a.placeholder = q.moznosti ? "Doplnění vlastním textem (nepovinné)" : "Napište odpověď";
  a.value = (odp[q.id] || {}).text || ""; a.oninput = () => ulozText(q.id, "text", a.value);
  r.append(a);
  return r;
}
function prejdi(i) {
  krok = Math.min(Math.max(i, 0), KROKY.length - 1);
  try { localStorage.setItem(KLIC_KROK, String(krok)); } catch (e) {}
  vykresli(); window.scrollTo(0, 0);
}
function vykresli() {
  const k = KROKY[krok];
  $("uvod").textContent = `Dotazník má ${KROKY.length} částí, každá je na vlastní obrazovce. Klikněte, co platí; značku a šířku napište, když je znáte. `
    + "Co nevíte, nechte prázdné. Odpovědi se ukládají samy, můžete se kdykoli vrátit.";
  const ul = $("kroky"); ul.replaceChildren();
  KROKY.forEach((x, i) => {
    const li = el("li"); const b = el("button", "krok" + (i === krok ? " aktualni" : "")); b.type = "button"; b.id = "krok-" + i;
    if (i === krok) b.setAttribute("aria-current", "step");
    b.append(el("span", "cislo", String(i + 1) + "."), el("span", null, x.nazev), el("span", "pocet"));
    b.onclick = () => prejdi(i); li.append(b); ul.append(li);
  });
  $("nadpis").textContent = `${krok + 1}. ${k.nazev}`;
  $("popis").textContent = k.popis || "";
  const o = $("obsah"); o.replaceChildren();
  for (const id of k.polozky || []) { const p = POLOZKY[id]; o.append(p.nazev ? radekMaterialu(p) : radekOtazky(p)); }
  if (!k.polozky) {   // poslední krok: souhrn a odeslání
    const s = el("p", "souhrn"); s.id = "souhrn"; const d = el("div"); d.id = "odeslat"; o.append(s, d);
  }
  const nav = $("navig"); nav.replaceChildren();
  const zpet = el("button", null, "‹ Zpět"); zpet.type = "button"; zpet.onclick = () => prejdi(krok - 1); zpet.disabled = krok === 0;
  nav.append(zpet);
  if (krok < KROKY.length - 1) { const dal = el("button", "dal", "Další ›"); dal.type = "button"; dal.onclick = () => prejdi(krok + 1); nav.append(dal); }
  stav();
}
// po kliknutí na volbu se překreslí jen aktuální krok; rozepsaný text zůstává (drží ho `odp`)
function obnov() { const y = window.scrollY; vykresli(); window.scrollTo(0, y); }
vykresli();
</script>
